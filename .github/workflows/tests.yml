name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30          # GÖREV-18: a hung run ends in half an hour, not after six hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
        timeout-minutes: 20
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Frontend helpers
        run: node --test tests/frontend.test.mjs
